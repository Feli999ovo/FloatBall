[package]
name = "floatball"
version = "0.1.0"
license = "MIT"
description = "液态玻璃悬浮球 · 桌面 AI 助手"
edition = "2021"

[lib]
name = "floatball_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
tokio = { version = "1", features = ["time", "sync", "macros", "rt"] }
rusqlite = { version = "0.32", features = ["bundled"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
xcap = "0.7"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"
log = "0.4"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
get-selected-text = "0.1"
active-win-pos-rs = "0.8"
arboard = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
