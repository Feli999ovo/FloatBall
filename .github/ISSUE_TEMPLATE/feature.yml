name: 功能建议
description: 提出一个具体的改进建议
title: "[建议] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题？
      description: 描述当前遇到的情况或不方便之处。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你希望怎么改？
      description: 简单描述你期待的行为。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其他做法
      description: 有试过的替代方案或补充说明吗？
    validations:
      required: false
