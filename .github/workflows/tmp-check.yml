name: tmp-check
on:
  push:
    branches: [split-commands]
permissions:
  contents: write
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: fmt 并提交回分支
        shell: bash
        working-directory: src-tauri
        run: |
          cargo fmt
          if ! git diff --quiet; then
            git config user.name tmp-check
            git config user.email tmp-check@example.com
            git commit -qam "fmt（tmp-check 自动）"
            git push -q
          fi
      - name: clippy
        shell: bash
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings
