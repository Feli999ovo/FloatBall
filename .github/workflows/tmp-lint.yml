name: tmp-lint
on:
  pull_request:
jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: fmt
        shell: bash
        working-directory: src-tauri
        run: |
          cargo fmt
          git diff > ../fmt.patch
      - name: clippy
        shell: bash
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings > ../clippy.txt 2>&1 || true
      - uses: actions/upload-artifact@v7
        with:
          name: lint-out
          path: |
            fmt.patch
            clippy.txt
