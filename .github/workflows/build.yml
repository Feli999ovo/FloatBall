name: 构建安装包

on:
  pull_request:
  workflow_dispatch:        # 在 Actions 页面手动点「Run workflow」
  push:
    tags: ['v*']            # 或者推一个 v0.1.0 这样的标签

jobs:
  test-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install playwright pillow
      - name: 安装测试用的浏览器
        run: |
          # 系统软件源偶尔连不上，装不了字体。连不上时只装浏览器本身，测试照常跑
          python -m playwright install --with-deps chromium || {
            printf '::warning::系统软件源连不上，没装上字体，这次的界面截图里中文可能显示成方块\n'
            python -m playwright install chromium
          }
      - run: python tools/test_ui.py ui-shots
      - uses: actions/upload-artifact@v7
        if: always()        # 测试失败时也留下截图
        with:
          name: 界面截图
          path: ui-shots

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest      # Apple 芯片 Mac
            args: --bundles app,dmg
          - os: windows-latest
            args: --bundles nsis  # 中文名用 NSIS 安装器更稳
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - run: cargo test --locked
        working-directory: src-tauri

      - uses: tauri-apps/tauri-action@v0
        with:
          args: ${{ matrix.args }}

      - name: 验证 Windows 安装器带简体中文
        if: runner.os == 'Windows'
        shell: bash
        run: grep -rq 'MUI_LANGUAGE "SimpChinese"' src-tauri/target/release/nsis

      - name: 验证 Windows 的安装、重装和卸载
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = (Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1).FullName
          # 装到 D 盘的临时目录：和「不装 C 盘」的用法一致，也避开 C 盘临时目录的短路径写法
          ./tools/check-windows-install.ps1 -Installer $installer -InstallDir (Join-Path $env:RUNNER_TEMP '悬浮球-安装测试')

      - name: 验证 macOS 临时签名
        if: runner.os == 'macOS'
        run: |
          app="src-tauri/target/release/bundle/macos/悬浮球.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --verbose=4 "$app" 2>&1 | tee signing.txt
          grep -qx 'Signature=adhoc' signing.txt

      - uses: actions/upload-artifact@v7
        with:
          name: 悬浮球-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    needs: [test-ui, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write        # 生成 Release 草稿需要
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: 悬浮球-*
          path: dist
          merge-multiple: true

      - name: 下载文件改成英文名
        working-directory: dist
        run: |
          # GitHub Release 会去掉文件名里的中文，所以下载文件用英文名；安装后的应用名不变
          for f in dmg/*.dmg nsis/*.exe; do mv "$f" "FloatBall_${f#*_}"; done
          ls -l FloatBall_*
          test "$(ls FloatBall_*_aarch64.dmg FloatBall_*_x64-setup.exe | wc -l)" = 2

      - name: 生成 Release 草稿
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" FloatBall_* --repo "$GITHUB_REPOSITORY" --verify-tag --draft --prerelease \
            --title "悬浮球 $GITHUB_REF_NAME 预览版" --notes-file - <<'EOF'
          预览版。还没有做 Apple 公证和 Windows 代码签名，第一次打开时系统会拦一次。

          | 平台 | 下载 | 第一次打开 |
          |---|---|---|
          | macOS（Apple 芯片） | `.dmg` | 拖进「应用程序」后打开一次，被拦截时到 **系统设置 → 隐私与安全性** 点 **仍要打开** |
          | Windows 10 / 11 | `-setup.exe` | SmartScreen 提示时点 **更多信息 → 仍要运行** |

          下载文件用英文名，安装后的应用名是「悬浮球」。接入模型、快捷键和数据位置见 README。
          EOF
