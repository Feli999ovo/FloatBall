name: Generate Specta contract
on:
  push:
    branches: [ipc-contract]
permissions:
  contents: read
jobs:
  generate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: cargo run --locked --features gen-ipc --bin gen_ipc -- ../src/ipc.d.ts
        working-directory: src-tauri
      - name: Save format patch
        if: always()
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml
          git diff --binary > fmt.patch
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: generated-contract
          path: |
            fmt.patch
            src/ipc.d.ts
