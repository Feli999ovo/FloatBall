<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>悬浮球</title>
<link rel="stylesheet" href="style.css" />
</head>
<body class="collapsed">
<div id="app">
  <!-- 顶栏：小球 + 胶囊输入框（展开时） -->
  <div id="bar">
    <div class="cap"><i class="cap-body"></i><i class="cap-glass"></i></div>
    <div id="orb" class="s-idle" role="button" tabindex="0" aria-label="悬浮球：点一下打开，拖动换位置，右键更多">
      <div class="float"><div class="breath">
        <div class="body"><i class="disp"></i><i class="hl"></i><i class="caus"></i></div>
        <img class="glass" src="assets/orb.png" alt="" draggable="false" />
        <div class="face" id="face">
          <i class="eye l"></i><i class="eye r"></i>
          <svg class="arc l" viewBox="0 0 18 9"><path d="M1.4 7.2A7.8 7.8 0 0 1 16.5 7.2"/></svg>
          <svg class="arc r" viewBox="0 0 18 9"><path d="M1.4 7.2A7.8 7.8 0 0 1 16.5 7.2"/></svg>
          <span class="orbit"></span>
        </div>
      </div></div>
    </div>
    <form id="capsule" autocomplete="off">
      <div id="attach" hidden></div>
      <textarea id="ask" rows="1" placeholder="有什么可以帮你？" aria-label="输入问题"></textarea>
      <button type="button" class="ib" id="vcMic" title="语音输入" aria-label="语音输入：听写到输入框" aria-pressed="false">
        <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7"/></svg>
      </button>
    </form>
  </div>

  <!-- 语音：球边三圈涟漪 + 转写气泡（原型的 vcRip / vcBub） -->
  <div id="vcRip" aria-hidden="true"><i></i><i></i><i></i></div>
  <div id="vcBub" aria-hidden="true"><p class="vc-txt"></p><span class="vc-cx">松开取消</span><span class="vc-time">0:00</span></div>

  <!-- 卡片 -->
  <section id="card" aria-live="polite">
    <!-- 卡片头（照原型 .x-ctab + .x-ch）：上面一行居中的「对话 | 任务」，下面标题 + 钉住标记 + 新对话 / 历史 / ⋯。设置在右键菜单里，收起点小球或 Esc -->
    <div class="ctab"><div class="seg" role="tablist" aria-label="对话与任务">
        <button role="tab" id="tabChat" aria-selected="true" aria-controls="vChat">对话</button>
        <button role="tab" id="tabTask" aria-selected="false" aria-controls="vTask" tabindex="-1">任务<span class="badge" id="tBadge" hidden></span></button>
      </div></div>
    <header>
      <div class="title" id="title">新对话</div>
      <button type="button" class="ib pnb" id="pinMark" title="取消钉住" aria-label="取消钉住" aria-pressed="true" hidden><svg viewBox="0 0 24 24"><path class="pnh" d="M9 3.5h6l-.9 5.6 3.4 3.4v1.6h-11v-1.6l3.4-3.4z"/><path d="M12 14.1v6.4"/></svg></button>
      <button class="ib" id="newBtn" title="新对话" aria-label="新对话"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="ib" id="histBtn" title="历史记录" aria-label="历史记录"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg></button>
      <button type="button" class="ib" id="moreBtn" title="更多" aria-label="更多：钉住" aria-haspopup="menu" aria-expanded="false" aria-controls="moreDd"><svg viewBox="0 0 24 24" class="dots"><circle cx="5.5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="18.5" cy="12" r="1.7"/></svg></button>
    </header>
    <div class="cmdd" id="moreDd" role="menu" aria-label="对话卡片更多操作">
      <button type="button" role="menuitemcheckbox" aria-checked="false" data-cm="pin" title="钉住：点别处不收起"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="pnh" d="M9 3.5h6l-.9 5.6 3.4 3.4v1.6h-11v-1.6l3.4-3.4z"/><path d="M12 14.1v6.4"/></svg><span>钉住</span><i class="cmck" aria-hidden="true">✓</i></button>
    </div>

    <!-- 对话 -->
    <div class="view" id="vChat">
      <div id="msgs"></div>
      <div id="empty">
        <div class="setup-tip">
          <p class="hello">先设置一个模型吧</p>
          <p class="sub">填好模型接口和 API Key 就能开始提问。</p>
          <button class="pri" id="setupBtn">去设置</button>
        </div>
        <p class="hello">嗨，我在。</p>
        <p class="sub">直接问，或者把文本文件拖到小球上，或者截屏提问。</p>
        <div class="chips">
          <button data-q="帮我把这段话改得更简洁：">改得更简洁</button>
          <button data-q="把下面的内容翻译成英文：">翻译成英文</button>
          <button data-q="用三句话解释：">三句话解释</button>
        </div>
      </div>
      <div id="stopRow" hidden><button id="stopBtn">停止生成</button></div>
    </div>

    <!-- 历史 -->
    <!-- 任务：这次打开以来发出的请求 -->
    <div class="view" id="vTask" role="tabpanel" aria-labelledby="tabTask" hidden><div id="tasks"></div></div>

    <div class="view" id="vHist" hidden>
      <div class="vh"><b>历史记录</b><span class="grow"></span><button class="txt danger" id="clearHist">全部删除</button></div>
      <ul id="histList"></ul>
      <p class="muted" id="histEmpty" hidden>还没有对话。</p>
    </div>

  </section>
  <div id="toast" role="status"></div>
  <!-- 卡片收起时回复完成：在小球旁冒一句 -->
  <button type="button" id="peek" aria-live="polite" tabindex="-1"></button>
  <!-- 悬停快捷入口（原型的 hvq / hvTip） -->
  <div id="hvq" class="x-hvq" aria-hidden="true"></div>
  <div id="hvTip" class="x-hvtip" role="tooltip"></div>
</div>
<script src="app.js"></script>
</body>
</html>
