<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>悬浮球</title>
<link rel="stylesheet" href="style.css" />
</head>
<body class="collapsed">
<div id="app">
  <!-- 顶栏：小球 + 胶囊输入框（展开时） -->
  <div id="bar">
    <div class="cap"><i class="cap-body"></i><i class="cap-glass"></i></div>
    <div id="orb" class="s-idle" role="button" tabindex="0" aria-label="悬浮球：点一下打开，拖动换位置，右键更多">
      <div class="float"><div class="breath">
        <div class="body"><i class="disp"></i><i class="hl"></i><i class="caus"></i></div>
        <i class="amb" aria-hidden="true"></i>
        <img class="glass" src="assets/orb.png" alt="" draggable="false" />
        <div class="face" id="face">
          <i class="eye l"></i><i class="eye r"></i>
          <svg class="arc l" viewBox="0 0 18 9"><path d="M1.4 7.2A7.8 7.8 0 0 1 16.5 7.2"/></svg>
          <svg class="arc r" viewBox="0 0 18 9"><path d="M1.4 7.2A7.8 7.8 0 0 1 16.5 7.2"/></svg>
          <span class="orbit"><b></b><b></b><b></b></span>
          <i class="spark"></i>
        </div>
      </div></div>
      <i class="need" aria-hidden="true">!</i>
      <i class="dn" aria-hidden="true"></i>
      <span class="share-arc" role="img" aria-label="正在共享屏幕"></span>
    </div>
    <form id="capsule" autocomplete="off">
      <div id="attach" hidden></div>
      <button type="button" id="planToggle" aria-pressed="false">执行</button>
      <textarea id="ask" rows="1" placeholder="问点什么" aria-label="输入问题"></textarea>
      <button type="button" class="ib" id="vcMic" title="语音输入" aria-label="语音输入：听写到输入框" aria-pressed="false">
        <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7"/></svg>
      </button>
    </form>
  </div>

  <!-- 语音：球边三圈涟漪 + 转写气泡（原型的 vcRip / vcBub） -->
  <div id="vcRip" aria-hidden="true"><i></i><i></i><i></i></div>
  <div id="vcBub" aria-hidden="true"><p class="vc-txt"></p><span class="vc-cx">松开取消</span><span class="vc-time">0:00</span></div>

  <!-- 卡片 -->
  <section id="card" aria-live="polite">
    <!-- 卡片头（照原型 .x-ctab + .x-ch）：上面一行居中的「对话 | 任务」，下面标题 + 钉住标记 + 新对话 / 历史 / ⋯。设置在右键菜单里，收起点小球或 Esc -->
    <div class="ctab"><div class="seg" role="tablist" aria-label="对话与任务">
        <button role="tab" id="tabChat" aria-selected="true" aria-controls="vChat">对话</button>
        <button role="tab" id="tabTask" aria-selected="false" aria-controls="vTask" tabindex="-1">任务<span class="badge" id="tBadge" hidden></span></button>
      </div></div>
    <header>
      <div class="title" id="title">新对话</div>
      <button type="button" class="ib pnb" id="pinMark" title="取消钉住" aria-label="取消钉住" aria-pressed="true" hidden><svg viewBox="0 0 24 24"><path class="pnh" d="M9 3.5h6l-.9 5.6 3.4 3.4v1.6h-11v-1.6l3.4-3.4z"/><path d="M12 14.1v6.4"/></svg></button>
      <button class="ib" id="newBtn" title="新对话" aria-label="新对话"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="ib" id="histBtn" title="历史记录" aria-label="历史记录"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg></button>
      <button type="button" class="ib" id="moreBtn" title="更多" aria-label="更多：钉住、临时对话、交给终端" aria-haspopup="menu" aria-expanded="false" aria-controls="moreDd"><svg viewBox="0 0 24 24" class="dots"><circle cx="5.5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="18.5" cy="12" r="1.7"/></svg></button>
    </header>
    <div class="cmdd" id="moreDd" role="menu" aria-label="对话卡片更多操作">
      <button type="button" role="menuitemcheckbox" aria-checked="false" data-cm="pin" title="钉住：点别处不收起"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="pnh" d="M9 3.5h6l-.9 5.6 3.4 3.4v1.6h-11v-1.6l3.4-3.4z"/><path d="M12 14.1v6.4"/></svg><span>钉住</span><i class="cmck" aria-hidden="true">✓</i></button>
      <button type="button" role="menuitemcheckbox" aria-checked="false" data-cm="tmp" title="临时对话：关闭后不保存"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" stroke-dasharray="3.2 2.6"/><path d="M9.5 9v6M14.5 9v6"/></svg><span>临时对话</span><i class="cmck" aria-hidden="true">✓</i></button>
      <button type="button" role="menuitem" data-cm="ho" title="交给终端：把要写代码的活交给终端里的编程工具"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4.5" width="18" height="15" rx="3"/><path d="M7.5 9.5l2.5 2.5-2.5 2.5M12.5 15h4"/></svg><span>交给终端</span></button>
    </div>

    <div id="shareBanner" hidden><span id="shareName"></span><button type="button" class="txt" id="shareStop">停止</button></div>
    <div id="feedPermission" class="tmpq" role="dialog" aria-label="辅助功能权限" hidden>
      <p>请在系统设置 → 隐私与安全性 → 辅助功能中允许悬浮球读取选中文字。</p>
      <div class="tmpqb"><button class="x-sb" id="feedClose">取消</button><button class="x-sb" id="feedSettings">打开辅助功能设置</button></div>
    </div>
    <p id="planBanner" hidden>只规划 · 不会改动任何东西</p>
    <p id="tmpBanner" hidden><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" stroke-dasharray="3.2 2.6"/><path d="M9.5 9v6M14.5 9v6"/></svg>临时对话 · 不保存，也不用来记忆</p>
    <div class="tmpq" id="changeQ" role="alertdialog" aria-labelledby="changeQT" hidden><p id="changeQT"></p><div class="tmpqb"><button type="button" class="x-sb" id="changeNo">取消</button><button type="button" class="x-sb x-pri" id="changeOk">撤回</button></div></div>
    <div class="tmpq" id="tmpQ" role="alertdialog" aria-labelledby="tmpQT" hidden><p id="tmpQT"></p><div class="tmpqb"><button type="button" class="x-sb" id="tmpNo">取消</button><button type="button" class="x-sb x-pri" id="tmpOk">转成临时</button></div></div>

    <!-- 对话 -->
    <div class="view" id="vChat">
      <div id="msgs"></div>
      <div id="empty">
        <div class="setup-tip">
          <p class="hello">先设置一个模型吧</p>
          <p class="sub">填好模型接口和 API Key 就能开始提问。</p>
          <button class="pri" id="setupBtn">去设置</button>
        </div>
        <p class="hello">嗨，我在。</p>
        <p class="sub">直接问，或者把文本文件拖到小球上，或者截屏提问。</p>
        <div class="chips">
          <button data-q="帮我把这段话改得更简洁：">改得更简洁</button>
          <button data-q="把下面的内容翻译成英文：">翻译成英文</button>
          <button data-q="用三句话解释：">三句话解释</button>
        </div>
      </div>
      <div id="stopRow" hidden><button id="stopBtn">停止生成</button></div>
    </div>

    <div class="view" id="vShare" role="dialog" aria-labelledby="shareTitle" hidden>
      <div class="vh"><b id="shareTitle">共享屏幕</b><span class="grow"></span><button type="button" class="txt" id="shareCancel">返回</button></div>
      <p id="shareStatus" role="status"></p>
      <button type="button" class="x-sb" id="shareSettings" hidden>打开系统设置</button>
      <div id="shareList" aria-label="可共享的窗口和屏幕"></div>
    </div>

    <!-- 历史 -->
    <!-- 任务：这次打开以来发出的请求 -->
    <div class="view" id="vTask" role="tabpanel" aria-labelledby="tabTask" hidden><div id="tasks"></div></div>

    <!-- 交给终端（B4，照原型 #ho）：交给哪个工具、哪个终端、项目文件夹、交接说明 -->
    <form class="view skill-draft" id="vSkill" aria-labelledby="skillTitle" hidden>
      <div class="vh"><b id="skillTitle">存为技能</b></div>
      <div class="skill-fields">
        <label>名字<input class="x-in" id="skillName" maxlength="60" required /></label>
        <label>什么时候用<input class="x-in" id="skillWhen" maxlength="500" /></label>
        <label>步骤<textarea class="x-in" id="skillSteps" rows="5" maxlength="6000" required></textarea></label>
      </div>
      <div class="skill-actions"><button type="button" class="x-sb" id="skillCancel">取消</button><button type="submit" class="x-sb" id="skillSave">保存技能</button></div>
    </form>
    <div class="view" id="vHo" role="dialog" aria-label="交给终端" hidden>
      <div class="vh"><b>交给终端</b><span class="grow"></span><button type="button" class="txt" id="hoReScan">重新扫描</button></div>
      <div class="ho">
        <div class="hof"><span id="hoToL">交给</span><select class="x-in" id="hoTo" aria-labelledby="hoToL" aria-describedby="hoToN"><option value="">正在找本机的工具</option></select></div>
        <p class="hon" id="hoToN" aria-live="polite"></p>
        <input class="x-in" id="hoCustom" placeholder="自定义命令，{file} = 交接说明文件" aria-label="自定义命令" spellcheck="false" hidden />
        <div class="hof"><span id="hoTmL">终端</span><select class="x-in" id="hoTm" aria-labelledby="hoTmL"></select></div>
        <div class="hof"><span id="hoDirL">项目</span><select class="x-in" id="hoDir" aria-labelledby="hoDirL"></select><button type="button" class="x-sb" id="hoPick">选择</button></div>
        <div class="hof"><span id="hoMdL">说明</span><span class="homd" id="hoMdS"></span><button type="button" class="txt" id="hoEdit" aria-expanded="false" aria-controls="hoMd">查看和修改</button></div>
        <textarea class="x-in" id="hoMd" spellcheck="false" rows="7" aria-labelledby="hoMdL" hidden></textarea>
        <div class="hof hosw"><span id="hoSaveL">同时存到项目里的 .floatball/handoff.md<small>Git 不会提交它</small></span><button type="button" class="x-sw" id="hoSave" role="switch" aria-checked="true" aria-labelledby="hoSaveL"></button></div>
        <p class="hon">终端里的工具要执行命令时会先问你，悬浮球不替它批准。</p>
      </div>
      <div class="hob"><button type="button" class="x-sb" id="hoCancel">取消</button><button type="button" class="x-sb x-pri" id="hoGo" disabled>打开终端</button></div>
    </div>

    <div class="view" id="vHist" hidden>
      <div class="vh"><b>历史记录</b><span class="grow"></span><button class="txt danger" id="clearHist">全部删除</button></div>
      <ul id="histList"></ul>
      <p class="muted" id="histEmpty" hidden>还没有对话。</p>
    </div>

  </section>
  <div id="toast" role="status"></div>
  <!-- 卡片收起时回复完成：在小球旁冒一句 -->
  <button type="button" id="peek" aria-live="polite" tabindex="-1"></button>
  <!-- 悬停快捷入口（原型的 hvq / hvTip） -->
  <div id="hvq" class="x-hvq" aria-hidden="true"></div>
  <div id="hvTip" class="x-hvtip" role="tooltip"></div>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
